<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="960" height="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="960" height="230" rx="18" fill="#f4f2ee"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17160f"/></marker>
  </defs>

  <!-- 1 rule -->
  <rect x="24" y="40" width="200" height="150" rx="16" fill="#fff" stroke="#e6e2d9"/>
  <text x="44" y="72" font-size="13" font-weight="700" fill="#6b675c" letter-spacing="1.5">1 · YOU</text>
  <text x="44" y="102" font-size="21" font-weight="800" fill="#17160f">Write the rule</text>
  <text x="44" y="132" font-size="14" fill="#3f3d36">"Alice owns 1–3,</text>
  <text x="44" y="152" font-size="14" fill="#3f3d36">Bob owns 4–6."</text>
  <text x="44" y="176" font-size="12" fill="#6b675c">OpenAI turns it into tests</text>

  <line x1="230" y1="115" x2="252" y2="115" stroke="#17160f" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 2 leak -->
  <rect x="260" y="40" width="200" height="150" rx="16" fill="#fff" stroke="#e6e2d9"/>
  <rect x="260" y="40" width="200" height="8" rx="4" fill="#e5484d"/>
  <text x="280" y="72" font-size="13" font-weight="700" fill="#b4232a" letter-spacing="1.5">2 · KANE CLI</text>
  <text x="280" y="102" font-size="21" font-weight="800" fill="#17160f">Finds the leak</text>
  <text x="280" y="132" font-size="14" fill="#3f3d36">Real browser, as Bob</text>
  <text x="280" y="152" font-size="14" fill="#3f3d36">then as Alice</text>
  <text x="280" y="176" font-size="12" fill="#6b675c">screenshot + run id</text>

  <line x1="466" y1="115" x2="488" y2="115" stroke="#17160f" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 3 fix -->
  <rect x="496" y="40" width="200" height="150" rx="16" fill="#fff" stroke="#e6e2d9"/>
  <text x="516" y="72" font-size="13" font-weight="700" fill="#6b675c" letter-spacing="1.5">3 · CODEX</text>
  <text x="516" y="102" font-size="21" font-weight="800" fill="#17160f">Fixes the code</text>
  <text x="516" y="132" font-size="14" fill="#3f3d36">One server-side</text>
  <text x="516" y="152" font-size="14" fill="#3f3d36">owner check</text>
  <text x="516" y="176" font-size="12" fill="#6b675c">committed only if tests pass</text>

  <line x1="702" y1="115" x2="724" y2="115" stroke="#17160f" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 4 proof -->
  <rect x="732" y="40" width="204" height="150" rx="16" fill="#17160f"/>
  <text x="752" y="72" font-size="13" font-weight="700" fill="#c9f53d" letter-spacing="1.5">4 · BUGSY</text>
  <text x="752" y="102" font-size="21" font-weight="800" fill="#fff">Proves it</text>
  <text x="752" y="132" font-size="14" fill="#e8e5dc">Fixed: Alice blocked,</text>
  <text x="752" y="152" font-size="14" fill="#e8e5dc">still sees her own</text>
  <text x="752" y="176" font-size="12" fill="#c9f53d">undo fix → test fails again</text>
</svg>
